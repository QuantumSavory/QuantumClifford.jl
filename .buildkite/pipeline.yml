secrets:
  - CODECOV_TOKEN

steps:
  - label: "QuantumClifford - {{matrix.PROJECT}} (local QECCore)"
    plugins:
      - JuliaCI/julia#v1:
          version: "1"
          compiled_size_limit: 10737418240 # 10GiB
    commands:
      - echo "Julia depot path $${JULIA_DEPOT_PATH}"
      - julia --startup-file=no --color=yes -e 'import Pkg; Pkg.Apps.add("TestItemApp")'
      - |
        project="{{matrix.PROJECT}}"
        suite="$${project##*/}"
        tag_filter="$$(julia --startup-file=no -e 'include("test/TestItemConfiguration.jl"); print(TestItemConfiguration.JULIATI_CI_FILTER)')"
        if [[ "$${project}" == "test" ]]; then
          suite="base"
          filter='package_name == "QuantumClifford" && dirname(filename) == realpath("test")'
        else
          filter="package_name == \"QuantumClifford\" && startswith(filename, string(realpath(\"$${project}\"), Base.Filesystem.path_separator))"
        fi
        filter="($${filter}) && ($${tag_filter})"

        mkdir -p coverage
        # Resolve current compatible versions; the generated manifest is CI-local.
        JULIA_PKG_PRECOMPILE_AUTO=0 julia --startup-file=no --color=yes \
          --project="$${project}" -e 'import Pkg; Pkg.instantiate()'
        juliati="$$(julia --startup-file=no -e 'print(joinpath(first(DEPOT_PATH), "bin", "juliati"))')"
        status=0
        if ! "$${juliati}" . \
          --progress log \
          --timeout none \
          --check-bounds auto \
          --threads auto \
          --coverage-lcov "coverage/$${suite}.info" \
          --filter "$${filter}" \
          --env "JULIA_LOAD_PATH=@:$${PWD}/$${project}:@stdlib"; then
          status=1
        fi
        if ! .buildkite/upload-juliati-coverage.sh "coverage/$${suite}.info"; then
          echo "Codecov upload failed."
        fi
        exit "$${status}"
    agents:
      queue: "default-queue"
    matrix:
      setup:
        PROJECT:
          - "test"
          - "test/static_analysis_and_doctests"
          - "test/ecc"
          - "test/oscar"
          - "test/python_decoders"
          - "test/slow"

  - label: "QuantumClifford - GPU {{matrix.LABEL}} (local QECCore)"
    plugins:
      - JuliaCI/julia#v1:
          version: "1"
          compiled_size_limit: 10737418240 # 10GiB
    commands:
      - echo "Julia depot path $${JULIA_DEPOT_PATH}"
      - julia --startup-file=no --color=yes -e 'import Pkg; Pkg.Apps.add("TestItemApp")'
      - |
        project="test/gpu/{{matrix.TAG}}"
        tag_filter="$$(julia --startup-file=no -e 'include("test/TestItemConfiguration.jl"); print(TestItemConfiguration.JULIATI_CI_FILTER)')"
        filter="package_name == \"QuantumClifford\" && startswith(filename, string(realpath(\"$${project}\"), Base.Filesystem.path_separator)) && ($${tag_filter})"
        mkdir -p coverage
        # Resolve current compatible versions; the generated manifest is CI-local.
        JULIA_PKG_PRECOMPILE_AUTO=0 julia --startup-file=no --color=yes \
          --project="$${project}" -e 'import Pkg; Pkg.instantiate()'
        julia --startup-file=no --color=yes --project="$${project}" \
          .buildkite/check-gpu.jl "{{matrix.TAG}}"
        juliati="$$(julia --startup-file=no -e 'print(joinpath(first(DEPOT_PATH), "bin", "juliati"))')"
        status=0
        if ! "$${juliati}" . \
          --progress log \
          --timeout none \
          --check-bounds auto \
          --threads auto \
          --coverage-lcov "coverage/{{matrix.TAG}}.info" \
          --filter "$${filter}" \
          --env "JULIA_LOAD_PATH=@:$${PWD}/$${project}:@stdlib"; then
          status=1
        fi
        if ! .buildkite/upload-juliati-coverage.sh coverage/*.info; then
          echo "Codecov upload failed."
        fi
        exit "$${status}"
    agents:
      queue: "{{matrix.QUEUE}}"
    matrix:
      setup:
        LABEL: ["CUDA"]
        TAG: ["cuda"]
        QUEUE: ["cuda"]
      adjustments:
        - with:
            LABEL: "ROCm"
            TAG: "rocm"
            QUEUE: "rocm"
        - with:
            LABEL: "OpenCL"
            TAG: "opencl"
            QUEUE: "default-queue"

  - label: "QECCore - {{matrix.LABEL}} (local QuantumClifford)"
    plugins:
      - JuliaCI/julia#v1:
          version: "1"
          compiled_size_limit: 10737418240 # 10GiB
      - JuliaCI/julia-test#v1:
          package: "QECCore"
          test_args: "{{matrix.TEST_ARGS}}"
      - JuliaCI/julia-coverage#v1:
          dirs:
            - ./src
            - ./ext
            - ./lib/QECCore/src
            - ./lib/QECCore/ext
    commands:
      - echo "Julia depot path $${JULIA_DEPOT_PATH}"
    agents:
      queue: "{{matrix.QUEUE}}"
    matrix:
      setup:
        LABEL: ["General"]
        QUEUE: ["default-queue"]
        TEST_ARGS: ["general"]
      adjustments:
        - with:
            LABEL: "JET"
            QUEUE: "default-queue"
            TEST_ARGS: "jet"

  - label: "Downstream {{matrix.PACKAGE}}"
    plugins:
      - JuliaCI/julia#v1:
          version: "1"
          compiled_size_limit: 10737418240 # 10GiB
    command:
      - echo "Julia depot path $${JULIA_DEPOT_PATH}"
      - julia --project=$(mktemp -d) -e '
        using Pkg;
        pkg"dev .";
        Pkg.add("{{matrix.PACKAGE}}");
        Pkg.build("{{matrix.PACKAGE}}");
        Pkg.test("{{matrix.PACKAGE}}");'
    matrix:
      setup:
        PACKAGE: ["QuantumSavory", "BPGates", "QuantumSymbolics"]

  - label: "Downstream (dev) {{matrix.PACKAGE}}"
    plugins:
      - JuliaCI/julia#v1:
          version: "1"
          compiled_size_limit: 10737418240 # 10GiB
    command:
      - echo "Julia depot path $${JULIA_DEPOT_PATH}"
      - julia --project=$(mktemp -d) -e '
        using Pkg;
        pkg"dev .";
        Pkg.develop("{{matrix.PACKAGE}}");
        Pkg.build("{{matrix.PACKAGE}}");
        Pkg.test("{{matrix.PACKAGE}}");'
    matrix:
      setup:
        PACKAGE: ["QuantumSavory", "BPGates", "QuantumSymbolics"]
