env:
  JULIA_NUM_THREADS: auto

secrets:
  - CODECOV_TOKEN

steps:
  - label: "QuantumClifford - all non-hardware tests (local QECCore)"
    plugins:
      - JuliaCI/julia#v1:
          version: "1"
          compiled_size_limit: 10737418240 # 10GiB
    commands:
      - echo "Julia depot path $${JULIA_DEPOT_PATH}"
      - julia --startup-file=no --color=yes -e 'import Pkg; Pkg.Apps.add("TestItemApp")'
      - |
        juliati="$$(julia --startup-file=no -e
          'print(joinpath(first(DEPOT_PATH), "bin", "juliati"))')"
        common_args=(
          .
          --progress log
          --no-fail-on-detection-error
          --timeout none
          --check-bounds auto
          --threads 1
        )
        # Resolve every suite from its Project.toml, then expose only that suite's
        # dependencies to its test processes. The generated manifest is CI-local.
        run_project() {
          project="$$1"
          JULIA_PKG_PRECOMPILE_AUTO=0 julia --startup-file=no --color=yes \
            --project="$${project}" -e 'import Pkg; Pkg.instantiate()'
          "$${juliati}" "$${common_args[@]}" \
            --filter "package_name == \"QuantumClifford\" && startswith(filename, string(realpath(\"$${project}\"), Base.Filesystem.path_separator))" \
            --env "JULIA_LOAD_PATH=@:$${PWD}/$${project}:@stdlib"
        }
        "$${juliati}" "$${common_args[@]}" \
          --filter 'package_name == "QuantumClifford" && dirname(filename) == realpath("test")'
        run_project test/aqua
        run_project test/doctests
        run_project test/ecc
        run_project test/jet
        run_project test/oscar
        run_project test/python_decoders
        run_project test/slow
    agents:
      queue: "default-queue"

  - label: "QuantumClifford - GPU {{matrix.LABEL}} (local QECCore)"
    plugins:
      - JuliaCI/julia#v1:
          version: "1"
          compiled_size_limit: 10737418240 # 10GiB
    commands:
      - echo "Julia depot path $${JULIA_DEPOT_PATH}"
      - julia --startup-file=no --color=yes -e 'import Pkg; Pkg.Apps.add("TestItemApp")'
      - |
        project="test/gpu/{{matrix.TAG}}"
        # Resolve current compatible versions; the generated manifest is CI-local.
        JULIA_PKG_PRECOMPILE_AUTO=0 julia --startup-file=no --color=yes \
          --project="$${project}" -e 'import Pkg; Pkg.instantiate()'
        juliati="$$(julia --startup-file=no -e
          'print(joinpath(first(DEPOT_PATH), "bin", "juliati"))')"
        "$${juliati}" . \
          --progress log \
          --no-fail-on-detection-error \
          --timeout none \
          --check-bounds auto \
          --max-workers 1 \
          --filter "package_name == \"QuantumClifford\" && startswith(filename, string(realpath(\"$${project}\"), Base.Filesystem.path_separator))" \
          --env "JULIA_LOAD_PATH=@:$${PWD}/$${project}:@stdlib"
    agents:
      queue: "{{matrix.QUEUE}}"
    matrix:
      setup:
        LABEL: ["CUDA"]
        TAG: ["cuda"]
        QUEUE: ["cuda"]
      adjustments:
        - with:
            LABEL: "ROCm"
            TAG: "rocm"
            QUEUE: "rocm"
        - with:
            LABEL: "OpenCL"
            TAG: "opencl"
            QUEUE: "default-queue"

  - label: "QECCore - {{matrix.LABEL}} (local QuantumClifford)"
    plugins:
      - JuliaCI/julia#v1:
          version: "1"
          compiled_size_limit: 10737418240 # 10GiB
      - JuliaCI/julia-test#v1:
          package: "QECCore"
          test_args: "{{matrix.TEST_ARGS}}"
      - JuliaCI/julia-coverage#v1:
          dirs:
            - ./src
            - ./ext
            - ./lib/QECCore/src
            - ./lib/QECCore/ext
    commands:
      - echo "Julia depot path $${JULIA_DEPOT_PATH}"
    agents:
      queue: "{{matrix.QUEUE}}"
    matrix:
      setup:
        LABEL: ["General"]
        QUEUE: ["default-queue"]
        TEST_ARGS: ["general"]
      adjustments:
        - with:
            LABEL: "JET"
            QUEUE: "default-queue"
            TEST_ARGS: "jet"

  - label: "Downstream {{matrix.PACKAGE}}"
    plugins:
      - JuliaCI/julia#v1:
          version: "1"
          compiled_size_limit: 10737418240 # 10GiB
    command:
      - echo "Julia depot path $${JULIA_DEPOT_PATH}"
      - julia --project=$(mktemp -d) -e '
        using Pkg;
        pkg"dev .";
        Pkg.add("{{matrix.PACKAGE}}");
        Pkg.build("{{matrix.PACKAGE}}");
        Pkg.test("{{matrix.PACKAGE}}");'
    matrix:
      setup:
        PACKAGE: ["QuantumSavory", "BPGates", "QuantumSymbolics"]

  - label: "Downstream (dev) {{matrix.PACKAGE}}"
    plugins:
      - JuliaCI/julia#v1:
          version: "1"
          compiled_size_limit: 10737418240 # 10GiB
    command:
      - echo "Julia depot path $${JULIA_DEPOT_PATH}"
      - julia --project=$(mktemp -d) -e '
        using Pkg;
        pkg"dev .";
        Pkg.develop("{{matrix.PACKAGE}}");
        Pkg.build("{{matrix.PACKAGE}}");
        Pkg.test("{{matrix.PACKAGE}}");'
    matrix:
      setup:
        PACKAGE: ["QuantumSavory", "BPGates", "QuantumSymbolics"]
