env:
  JULIA_NUM_THREADS: auto

secrets:
  - CODECOV_TOKEN

steps:
  - label: "QuantumClifford - {{matrix.LABEL}} (local QECCore)"
    plugins:
      - JuliaCI/julia#v1:
          version: "1"
          compiled_size_limit: 10737418240 # 10GiB
      - JuliaCI/julia-test#v1:
          test_args: "{{matrix.TEST_ARGS}}"
      - JuliaCI/julia-coverage#v1:
          dirs:
            - ./src
            - ./ext
            - ./lib/QECCore/src
            - ./lib/QECCore/ext
    commands:
      - echo "Julia depot path $${JULIA_DEPOT_PATH}"
      - |
        for project in {{matrix.PROJECTS}}; do
          julia --project="$${project}" -e 'using Pkg; Pkg.instantiate()'
        done
      - |
        if [ -n "{{matrix.CONDA_PROJECT}}" ]; then
          julia --project="{{matrix.CONDA_PROJECT}}" -e 'using CondaPkg; CondaPkg.resolve()'
        fi
    agents:
      queue: "{{matrix.QUEUE}}"
    matrix:
      setup:
        LABEL: ["General"]
        QUEUE: ["default-queue"]
        TEST_ARGS: ["general"]
        PROJECTS: ["test/projects/oscar test/projects/python_decoders"]
        CONDA_PROJECT: ["test/projects/python_decoders"]
      adjustments:
        - with:
            LABEL: "Slow"
            QUEUE: "default-queue"
            TEST_ARGS: "slow"
            PROJECTS: ""
            CONDA_PROJECT: ""
        - with:
            LABEL: "JET"
            QUEUE: "default-queue"
            TEST_ARGS: "jet"
            PROJECTS: "test/projects/jet"
            CONDA_PROJECT: ""
        - with:
            LABEL: "GPU CUDA"
            QUEUE: cuda
            TEST_ARGS: "--jobs=1 KernelAbstractions/CUDA"
            PROJECTS: "test/projects/cuda"
            CONDA_PROJECT: ""
        - with:
            LABEL: "GPU ROCm"
            QUEUE: rocm
            TEST_ARGS: "--jobs=1 KernelAbstractions/ROCm"
            PROJECTS: "test/projects/rocm"
            CONDA_PROJECT: ""
        - with:
            LABEL: "GPU OpenCL"
            QUEUE: "default-queue"
            TEST_ARGS: "--jobs=1 KernelAbstractions/OpenCL"
            PROJECTS: "test/projects/opencl"
            CONDA_PROJECT: ""

  - label: "QECCore - {{matrix.LABEL}} (local QuantumClifford)"
    plugins:
      - JuliaCI/julia#v1:
          version: "1"
          compiled_size_limit: 10737418240 # 10GiB
      - JuliaCI/julia-test#v1:
          package: "QECCore"
          test_args: "{{matrix.TEST_ARGS}}"
      - JuliaCI/julia-coverage#v1:
          dirs:
            - ./src
            - ./ext
            - ./lib/QECCore/src
            - ./lib/QECCore/ext
    commands:
      - echo "Julia depot path $${JULIA_DEPOT_PATH}"
    agents:
      queue: "{{matrix.QUEUE}}"
    matrix:
      setup:
        LABEL: ["General"]
        QUEUE: ["default-queue"]
        TEST_ARGS: ["general"]
      adjustments:
        - with:
            LABEL: "JET"
            QUEUE: "default-queue"
            TEST_ARGS: "jet"

  - label: "Downstream {{matrix.PACKAGE}}"
    plugins:
      - JuliaCI/julia#v1:
          version: "1"
          compiled_size_limit: 10737418240 # 10GiB
    command:
      - echo "Julia depot path $${JULIA_DEPOT_PATH}"
      - julia --project=$(mktemp -d) -e '
        using Pkg;
        pkg"dev .";
        Pkg.add("{{matrix.PACKAGE}}");
        Pkg.build("{{matrix.PACKAGE}}");
        Pkg.test("{{matrix.PACKAGE}}");'
    matrix:
      setup:
        PACKAGE: ["QuantumSavory", "BPGates", "QuantumSymbolics"]

  - label: "Downstream (dev) {{matrix.PACKAGE}}"
    plugins:
      - JuliaCI/julia#v1:
          version: "1"
          compiled_size_limit: 10737418240 # 10GiB
    command:
      - echo "Julia depot path $${JULIA_DEPOT_PATH}"
      - julia --project=$(mktemp -d) -e '
        using Pkg;
        pkg"dev .";
        Pkg.develop("{{matrix.PACKAGE}}");
        Pkg.build("{{matrix.PACKAGE}}");
        Pkg.test("{{matrix.PACKAGE}}");'
    matrix:
      setup:
        PACKAGE: ["QuantumSavory", "BPGates", "QuantumSymbolics"]
